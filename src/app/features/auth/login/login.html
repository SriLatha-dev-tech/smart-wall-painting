<div class="login-container">

  <div class="login-card">

    <h2>Smart Wall Paint Visualizer</h2>
    <h3>Login</h3>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label>Email</label>
        <input 
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input 
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password">
      </div>

      <button type="submit">
        Login
      </button>

      <p>
        New user?
        <a routerLink="/register">
          Register here
        </a>
      </p>

    </form>

  </div>

</div>
